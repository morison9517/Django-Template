# =============================================================================
# Nginx = 本番でお客さんを最初に迎える受付
#
#   ▼ なぜ Django の前に置くのか
#
#     Django(gunicorn)は「考えて返事を作る」のが仕事です。
#     でもCSSや画像は考える必要がなく、ただファイルを渡すだけ。
#     それを Django にやらせると、考える窓口が塞がってしまいます。
#
#     お店に例えると、Nginx が入口の案内係です。
#       「パンフレットください」→ 案内係がその場で渡す(静的ファイル)
#       「注文したいです」    → 奥のカウンターに通す(Django)
#
#   ▼ このファイルの置き場所
#
#     compose.prod.yml から Nginx の箱の中に読み込ませています。
#     直したときは Nginx を再起動してください:
#         docker compose -f compose.prod.yml restart nginx
#
#   ▼ 開発中は使いません
#
#     compose.yml(開発用)には Nginx がありません。
#     開発中は Django が全部自分で配るので、これで困りません。
# =============================================================================

server {
    listen 80;

    # ★_ は「どのドメインで来ても受ける」という意味。
    #   ドメインを絞りたくなったら、ここに app.example.com と書く。
    #   ただし Django 側の DJANGO_ALLOWED_HOSTS も合わせること。
    server_name _;

    # アップロードの上限。ここを超えると Nginx が 413 で弾く。
    # ★settings.py の DATA_UPLOAD_MAX_MEMORY_SIZE と同じ値にしておく。
    #   片方だけ大きくしても意味がなく、「なぜか大きい画像だけ失敗する」になる。
    client_max_body_size 16M;

    # --- CSS / JS / ロゴ(自分たちが用意したファイル) ---
    #
    # web の箱が collectstatic でここに集めたものを、Nginx が直接配る。
    # expires 30d = ブラウザに30日キャッシュさせる(2回目以降が速くなる)。
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # --- 利用者が上げたファイル(プロフィールアイコン) ---
    #
    # ★こちらは箱の外の保管庫にある。箱を作り直しても消えない。
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        access_log off;
    }

    # --- それ以外は全部 Django に渡す ---
    location / {
        # "web" は compose.prod.yml のサービス名。Dockerが住所に変換してくれる。
        proxy_pass http://web:8000;

        # ★この4行が無いと Django が困る
        #
        #   Nginx を通すと、Django から見た相手は「Nginx」になってしまう。
        #   本当のアクセス元やドメインが分からなくなるので、ここで教えている。
        #
        #   特に X-Forwarded-Proto が無いと、HTTPSでアクセスしているのに
        #   Django が「HTTPだ」と勘違いして、リダイレクトが延々ループする。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 返事が遅いときに待つ時間。既定(60秒)だと重い処理で切れることがある。
        proxy_read_timeout 120s;
    }
}
